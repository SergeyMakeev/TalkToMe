name: macOS build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the built app (optional)
        required: false
        type: string
      test_release:
        description: Test an existing Apple silicon release on macOS 15 and 26 instead of rebuilding
        required: false
        type: string
      quarantine_release:
        description: Mark the installed test copy as a browser download to exercise Gatekeeper
        required: false
        type: boolean
        default: false
      apple_silicon_only:
        description: Build only Apple silicon on macOS 26 when macOS 15 runners are busy
        required: false
        type: boolean
        default: false
      source_ref:
        description: Optional source commit for a replacement runner build
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      MACOS_DEVELOPER_ID_P12:
        required: false
      MACOS_P12_PASSWORD:
        required: false
      MACOS_NOTARY_KEY_P8:
        required: false
      MACOS_NOTARY_KEY_ID:
        required: false
      MACOS_NOTARY_ISSUER_ID:
        required: false
permissions:
  contents: read
jobs:
  release-launch:
    if: github.event_name == 'workflow_dispatch' && inputs.test_release != ''
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Open the installed release through Launch Services
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.test_release }}
          QUARANTINE_RELEASE: ${{ inputs.quarantine_release }}
        run: bash Checks/mac_release_launch.sh
      - name: Check diagnostic logs before upload
        if: always()
        id: diagnostics
        run: python3 Checks/check_mac_launch_diagnostics.py build/mac-launch
      - uses: actions/upload-artifact@v6
        if: always() && steps.diagnostics.outcome == 'success'
        with:
          name: launch-diagnostics-${{ matrix.runner }}
          path: build/mac-launch/
          if-no-files-found: warn
  build:
    if: inputs.test_release == ''
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.apple_silicon_only && '["macos-26"]' || '["macos-15", "macos-15-intel"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      NOTARIZE: ${{ inputs.version != '' && vars.MACOS_NOTARIZE_RELEASES == 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check insertion verification and clipboard preservation
        run: |
          swiftc Mac/TextInsertion.swift Mac/ClipboardPaste.swift Checks/MacInsertionChecks.swift Checks/MacInsertionMain.swift -o "$RUNNER_TEMP/insertion-checks"
          "$RUNNER_TEMP/insertion-checks"
      - name: Build and sign the app bundle
        env:
          APP_VERSION: ${{ inputs.version }}
        run: bash Mac/build.sh --defer-dmg
      - name: Check settings, shortcuts and llama-server completions
        run: |
          build/mac/TalkToMe.app/Contents/MacOS/TalkToMe --self-test
          build/mac/TalkToMe.app/Contents/MacOS/TalkToMe --check-insertion
          python3 Checks/mac_server.py build/mac/TalkToMe.app/Contents/MacOS/TalkToMe
      - name: Download and run the bundled translator
        run: build/mac/TalkToMe.app/Contents/MacOS/TalkToMe --check-local-translation
      - name: Open the result window and first-run Settings
        timeout-minutes: 2
        run: |
          build/mac/TalkToMe.app/Contents/MacOS/TalkToMe --check-window &
          app_pid=$!
          for i in {1..30}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then wait "$app_pid"; exit $?; fi
            sleep 1
          done
          sample "$app_pid" 1 -file "$RUNNER_TEMP/TalkToMe-sample.txt"
          head -160 "$RUNNER_TEMP/TalkToMe-sample.txt"
          kill "$app_pid"
          exit 1
      - name: Transcribe a sample on the CPU
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/tiny.en.bin" https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-tiny.en.bin
          echo "921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f  $RUNNER_TEMP/tiny.en.bin" | shasum -a 256 -c -
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/vad.bin" https://huggingface.co/ggml-org/whisper-vad/resolve/9ffd54a1e1ee413ddf265af9913beaf518d1639b/ggml-silero-v5.1.2.bin
          echo "29940d98d42b91fbd05ce489f3ecf7c72f0a42f027e4875919a28fb4c04ea2cf  $RUNNER_TEMP/vad.bin" | shasum -a 256 -c -
          build/mac/TalkToMe.app/Contents/MacOS/TalkToMe --check-asr "$RUNNER_TEMP/tiny.en.bin" build/mac/whisper.cpp/samples/jfk.wav "$RUNNER_TEMP/vad.bin"
      - name: Verify the reset is scoped to this app's Accessibility approval
        run: build/mac/TalkToMe.app/Contents/MacOS/TalkToMe --check-access-reset
      - name: Quit with a loaded model and during speech processing
        timeout-minutes: 4
        run: bash Checks/mac_shutdown.sh build/mac/TalkToMe.app/Contents/MacOS/TalkToMe "$RUNNER_TEMP/tiny.en.bin" build/mac/whisper.cpp/samples/jfk.wav "$RUNNER_TEMP/vad.bin"
      - name: Import Developer ID Application certificate
        if: env.NOTARIZE == 'true'
        id: certificate
        uses: Apple-Actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-file-base64: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
      - name: Create drag-to-install DMG
        env:
          IDENTITIES: ${{ steps.certificate.outputs.identities }}
        run: |
          if [[ "$NOTARIZE" == true ]]; then
            identity=$(jq -er 'map(select(.name | startswith("Developer ID Application: "))) | select(length == 1) | .[0].hash' <<< "$IDENTITIES")
            bash Mac/package-dmg.sh "$identity"
          else
            bash Mac/package-dmg.sh
          fi
      - name: Notarize and staple the release disk image
        if: env.NOTARIZE == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: bash Mac/notarize-dmg.sh "build/mac/TalkToMe-macOS-$(uname -m).dmg"
      - name: Mount the installer and test the copied app
        run: bash Checks/mac_dmg.sh "build/mac/TalkToMe-macOS-$(uname -m).dmg"
      - uses: actions/upload-artifact@v6
        with:
          name: TalkToMe-macOS-${{ runner.arch }}
          path: build/mac/TalkToMe-macOS-*.dmg
          if-no-files-found: error
