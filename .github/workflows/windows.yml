name: Windows build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the packaged app (optional)
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      APP_VERSION: ${{ inputs.version || '1.0.0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/TalkToMe/engines
          key: windows-runtime-${{ hashFiles('Shared/WindowsRuntime.json') }}
      - name: Build the small crash monitor
        run: |
          cmake -S Desktop/Diagnostics -B build/diagnostics -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/diagnostics --config Release --parallel 4
      - name: Fetch pinned speech test audio
        run: |
          New-Item -ItemType Directory -Force build/native-src/whisper.cpp/samples
          Invoke-WebRequest https://raw.githubusercontent.com/ggml-org/whisper.cpp/2eeeba56e9edd762b4b38467bab96c2517163158/samples/jfk.wav -OutFile build/native-src/whisper.cpp/samples/jfk.wav
      - name: Build desktop app and checks
        run: dotnet build Checks/TalkToMe.Checks.csproj --configuration Release "-p:Version=$env:APP_VERSION"
      - name: Run noninteractive checks
        run: dotnet run --project Checks/TalkToMe.Checks.csproj --configuration Release --no-build
      - name: Verify crash dumps in a disposable process
        run: dotnet run --project Checks -c Release --no-build -- --crash-check
      - name: Verify hotkey release and microphone failure recovery
        run: dotnet run --project Checks -c Release --no-build -- --capture-check
      - name: Verify native focus helper crash and hang isolation
        run: dotnet run --project Checks -c Release --no-build -- --focus-check
      - name: Download the default models, transcribe and translate using the bundled engines
        run: dotnet run --project Checks -c Release --no-build -- --local-models build/model-check build/native-src/whisper.cpp/samples/jfk.wav qwen2
      - name: Verify portable CPU fallback
        env:
          TALKTOME_CPU: portable
        run: dotnet run --project Checks -c Release --no-build -- --local-models build/model-check build/native-src/whisper.cpp/samples/jfk.wav qwen2
      - name: Check Qwen engineering editing on the CPU
        run: dotnet run --project Checks -c Release --no-build -- --translation-check build/model-check qwen2 cpu
      - name: Verify automatic fallback with NVIDIA devices hidden
        env:
          CUDA_VISIBLE_DEVICES: '-1'
          TALKTOME_EXPECT_BACKEND: CPU
        run: dotnet run --project Checks -c Release --no-build -- --local-models build/model-check build/native-src/whisper.cpp/samples/jfk.wav qwen2
      - name: Test Parakeet and TranslateGemma with automatic CPU fallback
        env:
          CUDA_VISIBLE_DEVICES: '-1'
          TALKTOME_EXPECT_BACKEND: CPU
        run: |
          dotnet run --project Checks -c Release --no-build -- --local-models build/model-check build/native-src/whisper.cpp/samples/jfk.wav translategemma parakeet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project Checks -c Release --no-build -- --translation-check build/model-check translategemma cpu
      - name: Test Parakeet on the portable CPU runtime
        env:
          TALKTOME_CPU: portable
        run: dotnet run --project Checks -c Release --no-build -- --local-models build/model-check build/native-src/whisper.cpp/samples/jfk.wav translategemma parakeet
      - name: Check Python worker syntax
        run: python -m py_compile asr/worker.py
      - name: Publish desktop app
        if: ${{ !inputs.version }}
        run: dotnet publish Desktop/TalkToMe.csproj --configuration Release -r win-x64 --self-contained true --output build/app
      - uses: actions/upload-artifact@v6
        if: ${{ !inputs.version }}
        with:
          name: TalkToMe-Windows
          path: build/app/
          if-no-files-found: error
          retention-days: 3
      - name: Package Windows x64 release
        if: inputs.version
        shell: pwsh
        run: |
          $package = 'build/windows-release'
          dotnet publish Desktop/TalkToMe.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true "-p:Version=$env:APP_VERSION" -o $package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in 'TalkToMe.exe','TalkToMe.CrashMonitor.exe','TalkToMe.FocusHost.exe') {
            if (!(Test-Path -LiteralPath (Join-Path $package $file))) { throw "Missing release file: $file" }
          }
          if (Test-Path -LiteralPath "$package/engines") { throw 'App releases must reuse the separate runtime, not bundle engines.' }
          New-Item -ItemType Directory -Path "$package/asr"
          Copy-Item -LiteralPath asr/worker.py -Destination "$package/asr"
          Copy-Item -LiteralPath TalkToMe.cmd, setup.ps1, requirements.txt, settings.example.json, README.md, LICENSE -Destination $package
          ./.github/scripts/package-windows.ps1 -Source $package -Destination build/TalkToMe-Windows-x64.zip
      - uses: actions/upload-artifact@v6
        if: inputs.version
        with:
          name: TalkToMe-Windows-x64
          path: build/TalkToMe-Windows-x64.zip
          if-no-files-found: error
          retention-days: 3
